name: Build map data

# Free on public repos. Runs on GitHub's machines, commits the results back,
# and Vercel deploys whatever lands on main.

on:
  workflow_dispatch:          # run it by hand from the Actions tab
  schedule:
    - cron: "17 8 1 * *"      # 1st of each month, 08:17 UTC

permissions:
  contents: write

jobs:
  zoning:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install shapely pyshp pyproj

      - name: Fetch zoning
        run: python scripts/fetch_zoning.py

      # keep going if this fails, and leave the output in the repo so it's readable
      - name: Fetch homes where zoning is silent
        continue-on-error: true
        timeout-minutes: 12
        run: |
          mkdir -p data
          python scripts/fetch_gap_homes.py 2>&1 | tee data/_gap-log.txt

      - name: Fetch census density
        continue-on-error: true
        run: |
          mkdir -p data
          python scripts/fetch_density.py 2>&1 | tee data/_density-log.txt

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No change — leaving the existing snapshot alone."
            exit 0
          fi
          git commit -m "Update zoning snapshot"
          git push
